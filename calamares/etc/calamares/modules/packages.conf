---
# What Calamares removes from the TARGET system after unpacking the live
# filesystem onto it. This runs inside the newly installed root, not the live
# session, so removing calamares here does not disturb the running installer.
#
# EVERY NAME HERE MUST BE A PACKAGE THIS IMAGE ACTUALLY INSTALLS.
#
# The module runs, literally:
#     apt-get --purge -q -y remove <every name below>
# and apt exits 100 with "E: Unable to locate package X" if it has never heard
# of X. For an INSTALLED package apt resolves it from /var/lib/dpkg/status and
# needs no index at all -- but a name that is neither installed nor in an index
# is fatal, and it takes the whole installation down with it:
#
#     "Installation failed after bootloader installation finished.
#      The package manager could not make changes to the installed system.
#      ... returned error code 100."
#
# calamares-settings-debian's own list names live-boot-doc, live-config-doc,
# live-task-localisation and live-task-recommended. Debian's live ISO gets away
# with that because its medium carries a full pool/ + dists/, so apt can locate
# those names even though they are not installed. This ISO has no pool, and
# mk-rootfs.sh empties /var/lib/apt/lists, so on a machine with no network
# during install apt has no record of them whatsoever. All four are removed
# below. They were never installed here, so nothing is lost.
#
# mk-rootfs.sh asserts at build time that every name here is installed in the
# rootfs, so this list cannot drift out of sync again without failing the build.
backend: apt
operations:
  - remove:
      # The installer itself. Debian's list removes only the settings package
      # and leaves the calamares binary behind, which puts a broken installer in
      # the app grid of every installed system.
      - 'calamares'
      - 'calamares-settings-debian'
      # The live system. live-boot-initramfs-tools is included because removing
      # live-boot alone orphans it and its initramfs hook keeps injecting the
      # live scripts into every future initramfs.
      - 'live-boot'
      - 'live-boot-initramfs-tools'
      - 'live-config'
      - 'live-config-systemd'
      - 'live-tools'
      # Only present so live-config could create the live user at boot.
      - 'user-setup'

---
# What Calamares removes from the TARGET system after unpacking the live
# filesystem onto it. This runs inside the newly installed root, not the live
# session, so removing calamares here does not disturb the running installer.
#
# Extends calamares-settings-debian's list with:
#   calamares, calamares-settings-debian-*  -- Debian's list removes the settings
#       package but leaves the calamares binary behind, which puts a broken
#       installer in the app grid of every installed system.
#   live-boot-initramfs-tools -- live-boot's helper. Removing live-boot alone
#       orphans it, and its initramfs hook keeps injecting the live scripts.
#   user-setup -- only there for live-config's account creation at boot.
backend: apt
operations:
  - remove:
      - 'calamares'
      - 'calamares-settings-debian'
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-boot-initramfs-tools'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'user-setup'
